<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGCA-H</title>

<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
body { background:#f4f6f9; margin:0; }

.sidebar {
    height:100vh;
    background:#212529;
    color:#fff;
    position:fixed;
    width:220px;
}

.sidebar a {
    color:white;
    padding:12px;
    display:block;
    text-decoration:none;
}

.sidebar a:hover { background:#343a40; }

.main { margin-left:220px; }

.header {
    background:white;
    padding:15px;
    border-bottom:1px solid #ddd;
}

.content { padding:20px; }

.card-indicator { border-left:5px solid #2196F3; }
</style>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar w3-bar-block">

<h4 class="w3-center w3-padding">SIGCA-H</h4>
<hr>

<a href="#" class="menu" data-modulo="dashboard.html">Dashboard</a>

<div class="w3-small w3-padding w3-text-grey">OPERACIÓN SANITARIA</div>

<a href="#" class="menu" data-modulo="Control_Temp.html">Temperatura</a>
<a href="#" class="menu" data-modulo="Control_agua.html">Agua</a>
<a href="#" class="menu" data-modulo="Control_higiene.html">Higiene</a>
<a href="#" class="menu" data-modulo="recepcion_alimentos.html">Recepción</a>
<a href="#" class="menu" data-modulo="almacenamiento.html">Almacenamiento</a>

</div>

<!-- MAIN -->
<div class="main">

<div class="header w3-display-container">
    <h5>Sistema de Gestión</h5>
    <div class="w3-display-right">
        <span id="user-info"></span>
        <button id="logout" class="w3-button w3-border w3-text-red w3-small">
            Cerrar sesión
        </button>
    </div>
</div>

<div class="content" id="contenido">

<div class="w3-row-padding w3-margin-bottom">

<div class="w3-third">
<div class="w3-card w3-white w3-padding card-indicator">
<h6>Temperatura promedio</h6>
<h3 id="tempProm">--</h3>
</div>
</div>

<div class="w3-third">
<div class="w3-card w3-white w3-padding card-indicator">
<h6>Registros hoy</h6>
<h3 id="registros">--</h3>
</div>
</div>

</div>

<div class="w3-card w3-white">
<div class="w3-container w3-blue">
<h6>Control de Temperatura</h6>
</div>

<div class="w3-container">
<table class="w3-table w3-bordered" id="tablaTemp">
<tr>
<th>Área</th>
<th>Temp</th>
<th>Fecha</th>
<th>Estado</th>
</tr>
</table>
</div>
</div>

</div>

</div>

<script>

$(document).ready(function(){

// 🔐 sesión
async function checkSession(){
    try{
        let res = await fetch('backend/session_check.php');
        let data = await res.json();

        if(!data.logged){
            window.location.href = 'Login_W3.html';
        }
    }catch(e){
        console.error(e);
    }
}

checkSession();

// 👤 usuario
const nombre = localStorage.getItem("usuario") || "Usuario";
$("#user-info").text(`Usuario: ${nombre}`);

// 📦 cargar módulos
async function cargarModulo(mod){

    $("#contenido").html("<p>Cargando...</p>");

    try{
        const res = await fetch(mod);
        const html = await res.text();

        const temp = document.createElement('div');
        temp.innerHTML = html;

        let body = temp.querySelector("body");

        $("#contenido").html(
            body ? body.innerHTML : html
        );

    }catch(e){
        $("#contenido").html("<p class='w3-text-red'>Error al cargar</p>");
        console.error(e);
    }
}

// 🎯 menú
$(".menu").click(function(e){
    e.preventDefault();
    cargarModulo($(this).data("modulo"));
});

// 📊 datos dashboard
function cargarDatos(){

fetch('backend/get-temps.php')
.then(r=>r.json())
.then(res=>{
    if(res.status==="ok"){

        let d = res.data;

        $("#tablaTemp tr:not(:first)").remove();

        d.slice(0,5).forEach(x=>{
            let estado = (x.valor>5 || x.valor<-18) ? "w3-red" : "w3-green";

            $("#tablaTemp").append(`
            <tr>
            <td>${x.area}</td>
            <td>${x.valor}</td>
            <td>${x.fecha}</td>
            <td><span class="w3-tag ${estado}">
            ${estado==="w3-red"?"Alerta":"Correcto"}
            </span></td>
            </tr>`);
        });

        let prom = d.length 
            ? d.reduce((a,b)=>a+parseFloat(b.valor),0)/d.length 
            : 0;

        $("#tempProm").text(prom.toFixed(1)+" °C");

        let hoy = new Date().toISOString().split('T')[0];
        let hoyCount = d.filter(x=>x.fecha.startsWith(hoy)).length;

        $("#registros").text(hoyCount);
    }
});

}

// ⏱ auto refresh
setInterval(cargarDatos,30000);
cargarDatos();

// 🔓 logout
$("#logout").click(()=>{
    window.location.href = "backend/logout.php";
});

});

</script>

</body>
</html>
