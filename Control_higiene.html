<!DOCTYPE html>
<html>
<head>
<title>Control de Higiene - SIGCA-H</title>
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">

<style>
body{
margin:0;
font-family: Arial;
background:#f1f1f1;
}

.sidebar{
width:220px;
background:#212529;
position:fixed;
height:100vh;
color:white;
overflow-y:auto;
}

.sidebar a{
display:block;
color:white;
padding:12px;
text-decoration:none;
}

.sidebar a:hover{
background:#343a40;
}

.content{
margin-left:220px;
padding:20px;
}
</style>
</head>

<body>

<div class="sidebar">
<h3 class="w3-center w3-padding">SIGCA-H</h3>

<a href="backend/SIGCA-H_W3.html">Dashboard</a>

<p class="w3-small w3-padding">OPERACIÓN SANITARIA</p>

<a href="Control_Temp.html">Control de Temperatura</a>
<a href="Control_agua.html">Control de Agua</a>
<a href="Control_higiene.html">Control de Higiene</a>
<a href="recepcion_alimentos.html">Recepción de Alimentos</a>
</div>

<div class="content">

<h2>Control de Higiene</h2>

<div class="w3-card w3-white w3-padding">

<form id="formHigiene">

<label>Empleado</label>
<input id="empleado" class="w3-input w3-border" required>

<label class="w3-margin-top">Lavado de manos</label>
<select id="lavado_manos" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Uso de guantes</label>
<select id="guantes" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Uso de cubrebocas</label>
<select id="cubrebocas" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<!-- 🔥 NUEVOS CAMPOS -->

<label class="w3-margin-top">Uniforme limpio y completo</label>
<select id="uniforme" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Cabello recogido</label>
<select id="cabello" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Uso de cofia</label>
<select id="cofia" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Equipo de protección personal</label>
<select id="epp" class="w3-input w3-border">
<option>Correcto</option>
<option>Incorrecto</option>
</select>

<label class="w3-margin-top">Observaciones</label>
<textarea id="observaciones" class="w3-input w3-border"></textarea>

<button class="w3-button w3-blue w3-margin-top">
Registrar
</button>

</form>

</div>

</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 🔥 AJAX HIGIENE -->
<script>
$(function() {

  // Cargar registros de higiene
  function cargarRegistrosHigiene() {
    fetch('backend/get-higiene.php')
      .then(response => response.json())
      .then(records => {
        console.log('Registros de higiene cargados:', records);
      })
      .catch(error => {
        console.error('Error al cargar registros:', error);
      });
  }

  $('#formHigiene').on('submit', function(event) {
    event.preventDefault();

    const data = {
      empleado: $('#empleado').val(),
      lavado_manos: $('#lavado_manos').val(),
      guantes: $('#guantes').val(),
      cubrebocas: $('#cubrebocas').val(),
      uniforme: $('#uniforme').val(),
      cabello: $('#cabello').val(),
      cofia: $('#cofia').val(),
      epp: $('#epp').val(),
      observaciones: $('#observaciones').val()
    };

    console.log("Datos enviados:", data);

    fetch('backend/guardado_higiene.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      if(result.status === 'ok') {
        alert('Registro de higiene guardado correctamente');
        console.log(result);
        document.getElementById('formHigiene').reset();
        cargarRegistrosHigiene();
      } else {
        alert('Error al registrar higiene: ' + (result.message || 'Error desconocido'));
      }
    })
    .catch(error => {
      alert('Error al registrar higiene');
      console.error(error);
    });

  });

  // Cargar registros al iniciar
  cargarRegistrosHigiene();

});
</script>

</body>
</html>
