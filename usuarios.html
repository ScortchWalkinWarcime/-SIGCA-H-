<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SIGCA</title>

    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="w3-container">

    <h2 class="w3-center">Gestión de Usuarios</h2>

    <div class="w3-card w3-white w3-padding w3-margin-bottom">
        <h3>Información del sistema</h3>
        <p>Los roles se gestionan desde el backend.</p>
    </div>

    <div class="w3-card w3-white w3-padding">
        <h3>Lista de Usuarios</h3>
        <div id="usuarios-list">
            <p class="w3-center">Cargando usuarios...</p>
        </div>
    </div>

</div>

<script>

$(document).ready(function(){

    // 🔐 verificar sesión REAL (no localStorage)
    async function checkSession(){
        try{
            let res = await fetch("backend/session_check.php");
            let data = await res.json();

            if(!data.logged){
                window.location.href = "Login_W3.html";
                return null;
            }

            return data;

        }catch(e){
            console.error(e);
            return null;
        }
    }

    // 🔐 obtener usuario real desde backend
    async function getUser(){
        try{
            let res = await fetch("backend/get_user.php");
            return await res.json();
        }catch(e){
            console.error(e);
            return null;
        }
    }

    async function init(){

        const session = await checkSession();
        if(!session) return;

        const user = await getUser();

        if(!user || user.rol !== "admin"){
            $("#usuarios-list").html(`
                <p class='w3-center w3-text-red'>
                    Acceso denegado. Solo administradores.
                </p>
            `);
            return;
        }

        loadUsers();

    }

    // 🔥 AQUÍ ya puedes conectar BD después
    async function loadUsers(){

        try{
            let res = await fetch("backend/get_users.php"); // <- lo harás luego
            let data = await res.json();

            if(!data || data.length === 0){
                $("#usuarios-list").html("<p>No hay usuarios</p>");
                return;
            }

            let html = "";

            data.forEach(u => {
                html += `
                <div class="w3-card w3-padding w3-margin-bottom">
                    <p><strong>Nombre:</strong> ${u.nombre}</p>
                    <p><strong>Email:</strong> ${u.email}</p>
                    <p><strong>Rol:</strong> ${u.rol}</p>
                </div>
                `;
            });

            $("#usuarios-list").html(html);

        }catch(e){
            console.error(e);
            $("#usuarios-list").html("<p class='w3-text-red'>Error al cargar usuarios</p>");
        }
    }

    init();

});

</script>

</body>
</html>
