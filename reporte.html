<h2>Generar reporte PDF</h2>

<div class="form-section w3-white w3-padding w3-card-4">

    <p>
        Genera un reporte en formato PDF y descárgalo directamente en tu equipo.
    </p>

    <div class="w3-margin-bottom">
        <label>Seleccione el módulo</label>

        <select id="module"
                class="w3-select w3-border">

            <option value="" disabled selected>
                Elegir módulo
            </option>

            <option value="agua">
                Control de Agua
            </option>

            <option value="higiene">
                Control de Higiene
            </option>

            <option value="temperatura">
                Control de Temperatura
            </option>

            <option value="recepcion">
                Recepción de Alimentos
            </option>

        </select>
    </div>

    <div class="w3-row-padding">

        <div class="w3-half w3-margin-bottom">
            <label>Fecha inicio</label>

            <input id="from-date"
                   class="w3-input w3-border"
                   type="date">
        </div>

        <div class="w3-half w3-margin-bottom">
            <label>Fecha fin</label>

            <input id="to-date"
                   class="w3-input w3-border"
                   type="date">
        </div>

    </div>

    <button id="download-report"
            class="w3-button w3-blue">

        Descargar PDF

    </button>

    <div id="status-box"
         class="w3-margin-top">
    </div>

</div>

<script>

(function(){

    const statusBox =
        document.getElementById('status-box');

    function showStatus(
        message,
        isError = false
    ){

        statusBox.innerHTML = `
            <div class="w3-panel
                        ${isError
                            ? 'w3-pale-red w3-border-red'
                            : 'w3-pale-green w3-border-green'}
                        w3-border">

                ${message}

            </div>
        `;
    }

    document
        .getElementById('download-report')
        .addEventListener(
            'click',
            () => {

                const module =
                    document.getElementById('module').value;

                const fromDate =
                    document.getElementById('from-date').value;

                const toDate =
                    document.getElementById('to-date').value;

                if (!module) {

                    showStatus(
                        'Selecciona un módulo.',
                        true
                    );

                    return;
                }

                showStatus(
                    'Generando PDF...'
                );

                const form =
                    document.createElement('form');

                form.method = 'POST';

                form.action =
                    '/SIGCA/backend/send_report.php';

                form.style.display =
                    'none';

                const fields = {

                    module: module,

                    from_date: fromDate,

                    to_date: toDate

                };

                for (const key in fields) {

                    const input =
                        document.createElement(
                            'input'
                        );

                    input.type = 'hidden';

                    input.name = key;

                    input.value =
                        fields[key];

                    form.appendChild(
                        input
                    );
                }

                document.body.appendChild(
                    form
                );

                form.submit();

                setTimeout(() => {

                    showStatus(
                        'Reporte generado correctamente.'
                    );

                }, 1000);

            }
        );

})();

</script>
