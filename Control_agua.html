<h2>Control de Agua</h2>

<div class="w3-card w3-white w3-padding">

<form id="formAgua">

<label>Área</label>
<select id="area" class="w3-input w3-border">
<option>Cocina</option>
<option>Lavado de utensilios</option>
<option>Baños</option>
</select>

<label class="w3-margin-top">Nivel de cloro (ppm)</label>
<input id="cloro" class="w3-input w3-border" type="number">

<label class="w3-margin-top">pH del agua</label>
<input id="ph" class="w3-input w3-border" type="number" step="0.1">

<!-- 🔥 NUEVOS CAMPOS -->

<label class="w3-margin-top">Potabilidad</label>
<select id="potabilidad" class="w3-input w3-border">
<option>Apta</option>
<option>No apta</option>
</select>

<label class="w3-margin-top">Temperatura del agua (°C)</label>
<input id="temperatura" class="w3-input w3-border" type="number">

<label class="w3-margin-top">Turbidez (NTU)</label>
<input id="turbidez" class="w3-input w3-border" type="number" step="0.1">

<label class="w3-margin-top">Dureza (mg/L)</label>
<input id="dureza" class="w3-input w3-border" type="number">

<label class="w3-margin-top">Metales pesados</label>
<select id="metales" class="w3-input w3-border">
<option>No detectados</option>
<option>Detectados</option>
</select>

<label class="w3-margin-top">Observaciones</label>
<textarea id="observaciones" class="w3-input w3-border"></textarea>

<button class="w3-button w3-blue w3-margin-top">
Registrar
</button>

</form>

</div>

</div>

<script>
$(function() {

  // Cargar registros de agua
  function cargarRegistrosAgua() {
    fetch('/SIGCA/backend/get-agua.php')
      .then(response => response.json())
      .then(records => {
        console.log('Registros cargados:', records);
      })
      .catch(error => {
        console.error('Error al cargar registros:', error);
      });
  }

  // Envío del formulario
  $('#formAgua').on('submit', function(event) {
    event.preventDefault();

    const data = {
      area: $('#area').val(),
      cloro_ppm: $('#cloro').val(),
      ph: $('#ph').val(),
      potabilidad: $('#potabilidad').val(),
      temperatura: $('#temperatura').val(),
      turbidez: $('#turbidez').val(),
      dureza: $('#dureza').val(),
      metales_pesados: $('#metales').val(),
      observaciones: $('#observaciones').val()
    };

    console.log("Datos enviados:", data);

    fetch('/SIGCA/backend/guardado_agua.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
      if(result.status === 'ok') {
        alert('Registro de agua guardado correctamente');
        console.log(result);
        document.getElementById('formAgua').reset();
        cargarRegistrosAgua();
      } else {
        alert('Error al enviar datos: ' + (result.message || 'Error desconocido'));
      }
    })
    .catch(error => {
      alert('Error al enviar datos');
      console.error(error);
    });

  });

  // Cargar registros al iniciar
  cargarRegistrosAgua();

});
</script>
