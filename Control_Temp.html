<h2>Control de Temperatura</h2>

<div class="w3-card w3-white w3-padding">

<form id="formTemp">

<label>Área</label>
<select id="area" class="w3-input w3-border">
<option>Refrigerador 1</option>
<option>Refrigerador 2</option>
<option>Congelador</option>
<option>Almacén</option>
</select>

<label class="w3-margin-top">Temperatura (°C)</label>
<input id="temperatura" class="w3-input w3-border" type="number" required>

<label class="w3-margin-top">Fecha y hora</label>
<input id="fecha" class="w3-input w3-border" type="datetime-local">

<button class="w3-button w3-blue w3-margin-top guardar">
Registrar
</button>

</form>

<p id="mensaje"></p>

</div>

<br>

<table class="w3-table w3-bordered w3-white" id="tablaTemp">
<tr>
<th>Área</th>
<th>Temperatura</th>
<th>Fecha</th>
<th>Estado</th>
</tr>
</table>

<script>

async function cargarDatos(){
    try {
        let res = await fetch('/SIGCA/backend/get-temps.php');
        let json = await res.json();

        if(json.status !== "ok") return;

        let datos = json.data;

        $("#tablaTemp tr:gt(0)").remove();

        datos.slice(0,10).forEach(d=>{
            agregarFila(d.area, d.valor, d.fecha);
        });

    } catch(error){
        console.error(error);
    }
}

function agregarFila(area, temp, fecha){
    let estado = (temp > 5 || temp < -18)
        ? '<span class="w3-tag w3-red">Alerta</span>'
        : '<span class="w3-tag w3-green">Correcto</span>';

    let fila = `
    <tr>
        <td>${area}</td>
        <td>${temp}°C</td>
        <td>${fecha}</td>
        <td>${estado}</td>
    </tr>
    `;

    $("#tablaTemp").append(fila);
}

$(document).on("submit", "#formTemp", function(e){
    e.preventDefault();

    let area = $("#area").val();
    let temp = $("#temperatura").val();
    let fecha = $("#fecha").val();

    fetch("/SIGCA/backend/guardado_temp.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ area, temp, fecha })
    })
    .then(r => r.json())
    .then(res => {
        if(res.status === "ok"){
            $("#mensaje").html("<span class='w3-text-green'>Guardado</span>");
            $("#formTemp")[0].reset();
            cargarDatos();
        } else {
            $("#mensaje").html("<span class='w3-text-red'>Error</span>");
        }
    });
});

cargarDatos();

</script>
