<h2>Salida de Alimentos</h2>

<div class="w3-card w3-white w3-padding">

<form id="formSalida">

<label>Producto</label>
<input id="producto" class="w3-input w3-border" required>

<label class="w3-margin-top">Proveedor</label>
<input id="proveedor" class="w3-input w3-border">

<label class="w3-margin-top">Temperatura del producto (°C)</label>
<input id="temperatura" class="w3-input w3-border" type="number">

<!-- Fecha asignada automáticamente en el servidor -->
<input id="fecha" class="w3-input w3-border" type="hidden">

<label class="w3-margin-top">Estado del alimento</label>
<select id="estado" class="w3-input w3-border">
<option>Fresco</option>
<option>Aceptable</option>
<option>En mal estado</option>
<option>Entregado</option>
</select>

<label class="w3-margin-top">Observaciones</label>
<textarea id="observaciones" class="w3-input w3-border"></textarea>

<button class="w3-button w3-blue w3-margin-top guardar">
Registrar salida
</button>

</form>

<p id="mensaje"></p>

</div>

<br>

<table class="w3-table w3-bordered w3-white" id="tablaSalida">
<tr>
<th>Producto</th>
<th>Proveedor</th>
<th>Estado</th>
<th>Temperatura</th>
<th>Resultado</th>
<th>Observación</th>
<th>Fecha</th>
</tr>
</table>

<script>

async function cargarRegistrosSalida(){
    try{
        let res = await fetch('/SIGCA/backend/get-salida.php');
        let json = await res.json();

        if(json.status !== 'ok'){
            throw new Error(json.message || 'Error al cargar datos');
        }

        let registros = json.data;

        $("#tablaSalida tr:not(:first)").remove();

        registros.forEach(r=>{
            let fila = `
            <tr>
                <td>${r.producto}</td>
                <td>${r.proveedor}</td>
                <td>${r.estado}</td>
                <td>${r.temperatura}</td>
                <td>
                    <span class="w3-tag ${r.resultado === 'ACEPTADO' ? 'w3-green' : 'w3-red'}">
                        ${r.resultado}
                    </span>
                </td>
                <td>${r.observaciones}</td>
                <td>${r.fecha}</td>
            </tr>`;
            
            $("#tablaSalida").append(fila);
        });

    }catch(e){
        console.error(e);
        $("#mensaje").html("<span class='w3-text-red'>Error al cargar datos</span>");
    }
}

$("#formSalida").submit(function(e){
    e.preventDefault();

    let data = {
        producto: $("#producto").val(),
        proveedor: $("#proveedor").val(),
        temperatura: $("#temperatura").val(),
        estado: $("#estado").val(),
        observaciones: $("#observaciones").val()
    };

    $("#mensaje").html("Guardando...");

    fetch('/SIGCA/backend/guardado_salida.php',{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(data)
    })
    .then(r=>r.json())
    .then(res=>{
        if(res.status==="ok"){
            $("#mensaje").html("<span class='w3-text-green'>Salida registrada</span>");
            $("#formSalida")[0].reset();
            cargarRegistrosSalida();
        }else{
            $("#mensaje").html("<span class='w3-text-red'>Error al guardar</span>");
        }
    })
    .catch(()=>{
        $("#mensaje").html("<span class='w3-text-red'>Error de conexión</span>");
    });
});

cargarRegistrosSalida();

</script>
